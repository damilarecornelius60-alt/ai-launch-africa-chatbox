<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Launch Africa — Chatbot Demo</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1115;
    color: #e8e8e8;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    margin: 0;
  }
  #chat-widget {
    width: 100%;
    max-width: 480px;
    background: #171a21;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    height: 640px;
  }
  #chat-header {
    padding: 18px 20px;
    background: #1f2430;
    font-weight: 600;
    border-bottom: 1px solid #262b36;
  }
  #chat-messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 14.5px;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: #3b6ef5;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: #262b36;
    color: #e8e8e8;
    border-bottom-left-radius: 4px;
  }
  .msg.thinking { opacity: 0.6; font-style: italic; }
  #chat-input-row {
    display: flex;
    padding: 12px;
    border-top: 1px solid #262b36;
    background: #171a21;
  }
  #chat-input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid #333a48;
    background: #0f1115;
    color: white;
    outline: none;
    font-size: 14.5px;
  }
  #chat-send {
    margin-left: 8px;
    padding: 10px 18px;
    border-radius: 20px;
    border: none;
    background: #3b6ef5;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  #chat-send:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<div id="chat-widget">
  <div id="chat-header">AI Launch Africa Assistant</div>
  <div id="chat-messages"></div>
  <div id="chat-input-row">
    <input id="chat-input" type="text" placeholder="Type a message..." />
    <button id="chat-send">Send</button>
  </div>
</div>

<script src="chat-widget.js"></script>
</body>
  </html>
